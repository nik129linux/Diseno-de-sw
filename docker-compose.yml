version: '3.8'

services:
  # === Contenedor de Desarrollo (tu entorno de trabajo) ===
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - ~/.m2:/home/vscode/.m2  # Cache de Maven host → container
    command: sleep infinity
    ports:
      - "8080:8080"
    networks:
      - datashield-net
    depends_on:
      mongodb:
        condition: service_healthy

  # === MongoDB (base de datos) ===
  mongodb:
    image: mongo:6.0
    container_name: datashield-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure_password_123
      MONGO_INITDB_DATABASE: datashield
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"  # Opcional: exponer para herramientas externas
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datashield-net

  # === Mongo Express (UI opcional para ver la BD) ===
  mongo-express:
    image: mongo-express:1.0
    container_name: datashield-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secure_password_123
      ME_CONFIG_MONGODB_URL: mongodb://admin:secure_password_123@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - datashield-net
    profiles:
      - tools  # Solo se levanta con: docker-compose --profile tools up

volumes:
  mongo-data:

networks:
  datashield-net:
    driver: bridge
